<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A simple, mobile-friendly todo application." />
    <meta name="color-scheme" content="light dark" />
    <title>Todo App</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        color: #1f2933;
        background-color: #f5f6f8;
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
        width: 100%;
      }

      img,
      svg,
      video,
      canvas {
        display: block;
        max-width: 100%;
      }

      input,
      button,
      textarea,
      select {
        font: inherit;
        max-width: 100%;
      }

      .app {
        width: 100%;
        max-width: 40rem;
        margin: 0 auto;
        padding: 1rem;
      }

      .app__header h1 {
        margin: 0 0 0.25rem;
        font-size: 1.5rem;
        overflow-wrap: break-word;
      }

      .app__tagline {
        margin: 0 0 1rem;
        color: #52606d;
      }

      .app__main {
        background-color: #ffffff;
        border: 1px solid #e4e7eb;
        border-radius: 0.5rem;
        padding: 1rem;
        overflow-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
