<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A simple, mobile-friendly todo list application." />
    <meta name="theme-color" content="#1f2937" />
    <title>Todo App</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        color: #1f2937;
        background-color: #f9fafb;
        overflow-x: hidden;
      }

      #root {
        width: 100%;
        max-width: 100%;
        min-height: 100vh;
      }

      img,
      svg,
      video {
        display: block;
        max-width: 100%;
      }

      input,
      button,
      select,
      textarea {
        font: inherit;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
