<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A simple, mobile-friendly todo list application." />
    <meta name="color-scheme" content="light dark" />
    <title>Todo</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        color: #1f2933;
        background-color: #f4f5f7;
        overflow-x: hidden;
      }

      #root {
        width: 100%;
        max-width: 40rem;
        margin: 0 auto;
        padding: 1rem;
      }

      img,
      svg,
      video {
        max-width: 100%;
        height: auto;
      }

      input,
      button,
      textarea,
      select {
        font: inherit;
        max-width: 100%;
      }

      h1,
      h2,
      h3,
      p,
      ul,
      ol {
        overflow-wrap: anywhere;
      }

      .app {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
      }

      .app__header h1 {
        margin: 0;
        font-size: 1.75rem;
      }

      .app__tagline {
        margin: 0.25rem 0 0;
        color: #52606d;
      }

      .app__main {
        background: #ffffff;
        border: 1px solid #e4e7eb;
        border-radius: 0.5rem;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
